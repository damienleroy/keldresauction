# Local development database: `docker compose -f compose.dev.yaml up -d`
services:
  postgres:
    image: postgres:17-alpine
    container_name: keldresauction-postgres
    environment:
      POSTGRES_DB: keldresauction
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - keldresauction-postgres-data:/var/lib/postgresql/data

volumes:
  keldresauction-postgres-data:
